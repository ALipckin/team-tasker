x-app-env: &app-env
  APP_PORT: "8080"
  LOG_LEVEL: ${LOG_LEVEL:-info}
  DB_USER: ${DB_USER}
  DB_PASSWORD: ${DB_PASSWORD}
  DB_DATABASE: ${DB_DATABASE}
  DB_HOST: db
  DB_PORT: "3306"
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required in prod}
  REDIS_DB: ${REDIS_DB:-0}
  JWT_SECRET: ${JWT_SECRET}
  JWT_TTL: ${JWT_TTL:-24h}
  TASKS_CACHE_TTL: ${TASKS_CACHE_TTL:-5m}
  RATE_LIMIT_RPS: ${RATE_LIMIT_RPS:-20}
  RATE_LIMIT_BURST: ${RATE_LIMIT_BURST:-40}
  TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
  MIGRATIONS_PATH: file:///app/internal/database/migrations

services:
  db:
    image: mysql:8.4
    container_name: "${COMPOSE_PROJECT_NAME}-db"
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE}
      TZ: ${TZ}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci", "--default-time-zone=+00:00"]
    ports:
      # Только localhost: БД не должна быть доступна снаружи хоста.
      - "127.0.0.1:${DB_EXPOSE_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7.4-alpine
    container_name: "${COMPOSE_PROJECT_NAME}-redis"
    restart: unless-stopped
    command: ["sh", "-c", "if [ -n \"$$REDIS_PASSWORD\" ]; then exec redis-server --requirepass \"$$REDIS_PASSWORD\"; else exec redis-server; fi"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required in prod}
    ports:
      # Только localhost: кэш общий для всех команд и не должен быть доступен снаружи.
      - "127.0.0.1:${REDIS_EXPOSE_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli $${REDIS_PASSWORD:+-a $$REDIS_PASSWORD} ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    image: "${COMPOSE_PROJECT_NAME}-app-prod"
    build:
      context: .
      dockerfile: docker/prod.Dockerfile
    container_name: "${COMPOSE_PROJECT_NAME}-app"
    restart: unless-stopped
    environment: *app-env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${APP_PORT}:8080"
volumes:
  mysql_data:
